<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Video Call (Manual Signaling)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #BB86FC;
            --success-color: #03dac6;
            --error-color: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* Video Section */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            /* Mirror local video */
        }

        #remoteVideo {
            transform: none;
            /* Don't mirror remote */
        }

        .label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* Controls Section */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .step {
            border-left: 3px solid var(--accent-color);
            padding-left: 15px;
            margin-bottom: 20px;
        }

        .step h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            resize: vertical;
            font-family: monospace;
            box-sizing: border-box;
            /* Important for width: 100% */
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #a370db;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #02b3a2;
        }

        #status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status-waiting {
            background: #333;
            color: #aaa;
        }

        .status-ready {
            background: #1a4d1a;
            color: #8f8;
        }

        .status-error {
            background: #4d1a1a;
            color: #f88;
        }
    </style>
</head>

<body>

    <h1>LAN Video Call</h1>

    <div class="container">
        <!-- Video Area -->
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">You</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label">Remote</div>
            </div>
        </div>

        <!-- Connection Controls -->
        <div class="controls">
            <div id="status-msg"></div>

            <div class="step">
                <h3>1. Start</h3>
                <p style="font-size: 0.9rem; color: #aaa;">Allow camera/mic access to begin.</p>
                <button id="initBtn" onclick="init()">Initialize Camera</button>
            </div>

            <div class="step" id="step-create" style="display:none;">
                <h3>2. Create Connection</h3>
                <p style="font-size: 0.9rem; color: #aaa;">Are you starting the call or joining?</p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="createOffer()">Start Call (Offer)</button>
                    <!-- Join button is implicit; if they have code, they paste it below -->
                </div>
            </div>

            <div class="step" id="step-data" style="display:none;">
                <h3>3. Exchange Data</h3>

                <p><strong>Your Code:</strong> <span style="font-size:0.8rem; color:#aaa">(Send this to your
                        friend)</span></p>
                <textarea id="localSdp" readonly placeholder="Generating..."></textarea>
                <button onclick="copyToClipboard('localSdp')"
                    style="margin-top: 5px; font-size: 0.8rem; padding: 5px;">Copy</button>

                <hr style="border-color: #444; margin: 20px 0;">

                <p><strong>Friend's Code:</strong> <span style="font-size:0.8rem; color:#aaa">(Paste their code
                        here)</span></p>
                <textarea id="remoteSdp" placeholder="Paste the code you received..."></textarea>
                <button id="answerBtn" onclick="handleRemoteSdp()" class="btn-success" style="margin-top: 10px;">Process
                    Code</button>
            </div>
        </div>
    </div>

    <script>
        const config = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" }
            ]
        };

        let pc;
        let localStream;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const initBtn = document.getElementById('initBtn');
        const statusMsg = document.getElementById('status-msg');

        // Helpers for UI
        function showStatus(msg, type = 'waiting') {
            statusMsg.textContent = msg;
            statusMsg.className = `status-${type}`;
            statusMsg.style.display = 'block';
        }

        // Logger helper
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${type.toUpperCase()}] ${msg}`;
            el.style.fontFamily = 'monospace';
            el.style.fontSize = '0.8rem';
            el.style.color = type === 'error' ? '#ff5555' : '#aaa';
            el.style.borderBottom = '1px solid #333';
            const logContainer = document.getElementById('debug-log') || createLogContainer();
            logContainer.prepend(el);
        }

        function createLogContainer() {
            const div = document.createElement('div');
            div.id = 'debug-log';
            div.style.marginTop = '20px';
            div.style.padding = '10px';
            div.style.background = '#000';
            div.style.border = '1px solid #333';
            div.style.maxHeight = '150px';
            div.style.overflowY = 'auto';
            document.querySelector('.container').appendChild(div);
            return div;
        }

        async function init() {
            try {
                showStatus("Initializing...", "waiting");
                log("Starting initialization...");

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("navigator.mediaDevices.getUserMedia is NOT supported in this browser/context. Are you using HTTP? Try localhost or HTTPS.");
                }

                // Try getting both video and audio
                try {
                    log("Requesting Video+Audio...");
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    log("Got Video+Audio stream.");
                } catch (e) {
                    log("Video+Audio failed: " + e.message, "error");

                    // Fallback: Try Video only
                    try {
                        log("Requesting Video Only...");
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        showStatus("Microphone not found, using video only.", "waiting");
                        log("Got Video Only stream.");
                    } catch (e2) {
                        log("Video Only failed: " + e2.message, "error");

                        // Fallback: Try Audio only
                        try {
                            log("Requesting Audio Only...");
                            localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
                            showStatus("Camera not found, using audio only.", "waiting");
                            log("Got Audio Only stream.");

                            // Offer to add fake video for testing purposes
                            if (confirm("Camera failed, but Mic works. Add a 'Fake Video' stream to test the video connection?")) {
                                const fakeStream = createFakeStream();
                                const videoTrack = fakeStream.getVideoTracks()[0];
                                localStream.addTrack(videoTrack);
                                log("Added FAKE video track to Real audio.");
                            }

                        } catch (e3) {
                            log("Audio Only failed: " + e3.message, "error");
                            // Fallback: Simulate Camera (Canvas) if completely failed
                            if (confirm("Camera/Mic failed (" + e3.name + "). Use simulated (fake) camera to test connection?")) {
                                localStream = createFakeStream();
                                log("Using FAKE stream.");
                            } else {
                                throw e; // Give up
                            }
                        }
                    }
                }

                // If we got a stream (real or fake), show it
                if (localStream.getVideoTracks().length > 0) {
                    localVideo.srcObject = localStream;
                } else {
                    // Audio only - show a placeholder or keep black
                    localVideo.style.background = "#222";
                    const label = localVideo.parentElement.querySelector('.label');
                    label.textContent = "You (Audio Only)";
                }

                createPeerConnection();

                initBtn.parentElement.style.display = 'none'; // Hide step 1
                document.getElementById('step-create').style.display = 'block';
                document.getElementById('step-data').style.display = 'block';

                if (statusMsg.className !== "status-waiting") {
                    showStatus("Ready. Choose 'Start Call' or paste a code from a friend.", "waiting");
                }
            } catch (e) {
                console.error(e);
                let msg = "Error: " + e.message;
                if (e.name === "NotFoundError") msg = "No device found.";
                if (e.name === "NotAllowedError") msg = "Permission denied.";

                showStatus(msg, "error");
                log(e.stack, "error");
            }
        }

        function createFakeStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, 640, 480);
            ctx.fillStyle = '#fff';
            ctx.font = '40px Arial';
            ctx.fillText('NO CAMERA', 200, 240);

            // Animation to prove it's live
            setInterval(() => {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, 640, 480);
                ctx.fillStyle = '#' + Math.floor(Math.random() * 16777215).toString(16);
                ctx.fillText('TEST VIDEO ' + Date.now(), 100, 240);
            }, 1000);

            const stream = canvas.captureStream(30);
            // Add a dummy audio track so logic holding audio doesn't break
            try {
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const dst = audioCtx.createMediaStreamDestination();
                osc.connect(dst);
                osc.start();
                const track = dst.stream.getAudioTracks()[0];
                stream.addTrack(track);
            } catch (e) { log("Could not create fake audio: " + e) }

            return stream;
        }

        function createPeerConnection() {
            pc = new RTCPeerConnection(config);

            // Add local tracks
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Handle remote track
            pc.ontrack = (event) => {
                console.log("Remote track received");
                remoteVideo.srcObject = event.streams[0];
            };

            // ICE Candidate handling
            pc.onicecandidate = (event) => {
                if (event.candidate === null) {
                    // ICE gathering complete
                    document.getElementById('localSdp').value = JSON.stringify(pc.localDescription);
                    showStatus("Code generated! Copy 'Your Code' and send it.", "ready");
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log("ICE State:", pc.iceConnectionState);
                if (pc.iceConnectionState === 'connected') {
                    showStatus("Connected!", "ready");
                }
                if (pc.iceConnectionState === 'disconnected') {
                    showStatus("Disconnected", "error");
                }
            }
        }

        async function createOffer() {
            showStatus("Generating offer... please wait for code.", "waiting");
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            // wait for onicecandidate (null) to populate text area with full SDP+ICE
        }

        async function createAnswer() {
            showStatus("Generating answer... please wait for code.", "waiting");
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            // wait for onicecandidate (null) to populate text area
        }

        async function handleRemoteSdp() {
            const remoteDataStr = document.getElementById('remoteSdp').value;
            if (!remoteDataStr) {
                alert("Please paste the remote code first!");
                return;
            }

            try {
                const remoteDesc = JSON.parse(remoteDataStr);
                await pc.setRemoteDescription(remoteDesc);

                if (remoteDesc.type === 'offer') {
                    // If we just received an offer, we need to answer it
                    await createAnswer();
                } else {
                    // If we just received an answer, we are done
                    showStatus("Answer processed. Connection establishing...", "waiting");
                }

            } catch (e) {
                console.error(e);
                showStatus("Invalid code or error processing: " + e.message, "error");
            }
        }

        function copyToClipboard(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            document.execCommand("copy"); // Fallback for older browsers/http

            // Try modern API if available
            if (navigator.clipboard) {
                navigator.clipboard.writeText(copyText.value);
            }

            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => btn.textContent = originalText, 1500);
        }
    </script>
</body>

</html>
