<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batch Hand Landmark Extractor</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
    .controls { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 20px; display: flex; gap: 10px; align-items: center; }
    #output { background: #000; padding: 15px; border-radius: 8px; overflow: auto; max-height: 500px; white-space: pre-wrap; color: #0f0; border: 1px solid #333; position: relative; }
    button { padding: 10px 20px; cursor: pointer; background: #444; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #666; }
    #copyBtn { background: #2a5a8a; }
    #copyBtn:hover { background: #3a6aaa; }
    #copyBtn:disabled { background: #333; color: #777; cursor: not-allowed; }
    .status-bar { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em; color: #aaa; }
  </style>
</head>
<body>

  <h2>Batch Image Processor</h2>
  <div class="controls">
    <input type="file" id="fileInput" accept="image/*" multiple />
    <button id="processBtn">Generate 2 * 63-D Vectors</button>
    <button id="copyBtn" disabled>Copy JSON</button>
  </div>

  <div class="status-bar">
    <span id="status">Ready.</span>
    <span id="copyFeedback"></span>
  </div>
  <pre id="output">JSON will appear here...</pre>

  <canvas id="canvas" style="display:none;"></canvas>
  <script src="script.js"></script>
</body>
</html>
